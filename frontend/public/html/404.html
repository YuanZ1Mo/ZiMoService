<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面不存在</title>
  <style>
    /* 服务端兜底 404(drogon setCustom404Page);配色对齐设计令牌 base.css */
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #F0F9FF; color: #0F172A; }
    .box { text-align: center; padding: 40px; }
    .code { font-size: 72px; font-weight: 800; background: linear-gradient(120deg,#0284C7 0%,#06B6D4 62%,#EC4899 140%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .desc { color: #475569; margin: 12px 0 24px; }
    a { color: #0284C7; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <p class="desc">页面不存在或已被移除</p>
    <a href="/">返回门户</a>
  </div>
</body>
</html>
