      <div class="fh-wrap">
        <div class="fh-topbar">
          <div class="fh-seals">

          <div class="fh-tb-group">

            <button class="btn-ghost fh-tb" id="fhNewDir" style="padding:6px 14px;font-size:13px">新建文件夹</button>
            <button class="btn-ghost fh-tb" id="fhQueueBtn" style="padding:6px 14px;font-size:13px" title="上传队列">队列</button>
            <button class="btn-ghost fh-tb" id="fhSharesBtn" style="padding:6px 14px;font-size:13px" title="我的分享">我的分享</button>

          <div class="fh-tb-group" id="fhSelBar" style="display:none">

            <button class="btn-ghost fh-tb" id="fhSelDelete" style="padding:6px 14px;font-size:13px">删除</button>
            <button class="btn-ghost fh-tb" id="fhSelShare" style="padding:6px 14px;font-size:13px">分享</button>
            <button class="btn-ghost fh-tb" id="fhSelMore" style="padding:6px 14px;font-size:13px">更多</button>

          <div class="fh-filters">

              <option value="file">文件</option>

            </div>
          </div>
          <div class="fh-search">
            <input id="fhSearchInput" placeholder="搜索当前空间" spellcheck="false">
            <button class="btn-ghost" id="fhSearchBtn" style="padding:6px 14px;font-size:13px">搜索</button>
            <button class="fh-op" id="fhSearchClear" title="清除搜索">×</button>
          </div>
        </div>
        <div class="fh-pathbar">

          <div class="fh-bread" id="fhBread"></div>
          <div class="fh-sortbar" id="fhSortBar"></div>
        </div>
        <div class="fh-table-wrap">

                <th class="fh-sortable" data-sort="size" title="点击排序 · Shift+点击组合排序">大小</th>
                <th class="fh-sortable" data-sort="type" title="点击排序 · Shift+点击组合排序">类型</th>
                <th class="fh-sortable" data-sort="mtime" title="点击排序 · Shift+点击组合排序">修改时间</th>
                <th class="fh-sortable" data-sort="owner" title="点击排序 · Shift+点击组合排序">归属者</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="fhBody"></tbody>
          </table>
        </div>
        <input type="file" id="fhFileInput" multiple style="display:none">
        <input type="file" id="fhDirInput" webkitdirectory style="display:none">
