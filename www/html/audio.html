<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZiMo 远程音频</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .audio-wrap { text-align: center; padding-top: 80px; }
  .audio-btn {
    font-size: 22px; padding: 18px 42px; border-radius: 999px;
    background: #2563eb; color: #fff; border: none; cursor: pointer;
  }
  .audio-btn:disabled { opacity: .5; cursor: not-allowed; }
  .audio-status { margin-top: 28px; color: #9aa4b2; font-size: 15px; }
  .audio-err { margin-top: 16px; color: #e06c6c; font-size: 14px; }
</style>
</head>
<body>

<div id="app" v-cloak>
  <nav class="nav">
    <div class="nav-brand">🎧 ZiMo 远程音频</div>
    <div class="nav-tabs"><a href="/control">⚙️ 控制中心</a></div>
    <div class="nav-status">
      <span class="dot" :class="playing?'on':'off'"></span>{{ statusText }}
    </div>
  </nav>

  <main class="main">
    <div class="audio-wrap">
      <button class="audio-btn" @click="toggle" :disabled="!!fatalError">
        {{ playing ? '⏹ 停止收听' : '▶ 开始收听' }}
      </button>
      <p class="audio-status">{{ statusText }}</p>
      <p class="audio-err" v-if="fatalError">{{ fatalError }}</p>
      <p class="audio-status" style="font-size:12px">音量请用手机系统按键调节</p>
    </div>
  </main>
</div>

<script src="/js/vue.global.prod.js"></script>
<script src="/js/audio-player.js"></script>
</body>
</html>
