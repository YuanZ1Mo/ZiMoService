<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZiMo 用量统计</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/x-icon" href="/resource/favicon.ico">
<style>
  .ds-wrap { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .ds-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
  .ds-card { background: #1b2430; border-radius: 12px; padding: 20px; text-align: center; }
  .ds-card .label { color: #9aa4b2; font-size: 13px; margin-bottom: 8px; }
  .ds-card .value { font-size: 26px; font-weight: 600; color: #e5edf5; }
  .ds-card .value.small { font-size: 18px; }
  .ds-toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
  .ds-refresh { background: #2563eb; color: #fff; border: none; padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  .ds-refresh:disabled { opacity: .5; cursor: not-allowed; }
  .ds-meta { color: #9aa4b2; font-size: 13px; }
  .ds-err { margin-top: 16px; color: #e06c6c; font-size: 14px; white-space: pre-wrap; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .badge.ok { background: #14532d; color: #4ade80; }
  .badge.fail { background: #4c1d1d; color: #f87171; }
</style>
</head>
<body>

<div id="app" v-cloak>
  <nav class="nav">
    <div class="nav-brand">📊 ZiMo 用量统计</div>
    <div class="nav-tabs"><a href="/control">⚙️ 控制中心</a></div>
    <div class="nav-status"><span class="dot" :class="available?'on':'off'"></span>{{ available ? '可用' : '不可用' }}</div>
  </nav>

  <main class="main">
    <div class="ds-wrap">
      <div class="ds-toolbar">
        <button class="ds-refresh" @click="refresh" :disabled="loading">{{ loading ? '刷新中…' : '🔄 手动刷新' }}</button>
        <span class="ds-meta">自动刷新:每 60 秒 · {{ lastUpdated }}</span>
      </div>

      <div class="ds-cards">
        <div class="ds-card">
          <div class="label">总余额</div>
          <div class="value" v-if="total !== null">{{ total }} <span style="font-size:14px">{{ currency }}</span></div>
          <div class="value small" v-else>—</div>
        </div>
        <div class="ds-card">
          <div class="label">赠送余额</div>
          <div class="value small" v-if="granted !== null">{{ granted }} <span style="font-size:12px">{{ currency }}</span></div>
          <div class="value small" v-else>—</div>
        </div>
        <div class="ds-card">
          <div class="label">充值余额</div>
          <div class="value small" v-if="topped !== null">{{ topped }} <span style="font-size:12px">{{ currency }}</span></div>
          <div class="value small" v-else>—</div>
        </div>
        <div class="ds-card">
          <div class="label">账户状态</div>
          <div><span class="badge" :class="available?'ok':'fail'">{{ available ? '✅ 可用' : '❌ 不可用' }}</span></div>
        </div>
      </div>

      <p class="ds-meta" style="margin-top:12px" v-if="cacheHit">(缓存数据 {{ cacheAt }})</p>
      <p class="ds-err" v-if="error">{{ error }}</p>
    </div>
  </main>
</div>

<script src="/js/vue.global.prod.js"></script>
<script src="/js/deepseek.js"></script>
</body>
</html>
