<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZiMo Service</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/x-icon" href="/resource/favicon.ico">
<script src="/js/vue.global.prod.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/resource/favicon.ico" alt="ZiMo" class="brand-icon">
      <span class="brand-name">ZiMo Service</span>
      <span class="brand-tag">server console</span>
    </div>
    <div class="topbar-right">
      <span class="conn-state" id="connState"><span class="dot"></span><span id="connText">在线</span></span>
      <button class="btn-ghost" id="logoutBtn">登出</button>
    </div>
  </header>

  <main class="main">
    <div class="main-body" id="mainBody">
      <!-- 加载中 -->
      <div class="main-center" id="loadingView">
        <span class="beacon beacon-pulse"></span>
      </div>
      <!-- 墨聚成印 粒子仪式(登录成功后播放) -->
      <div class="ink-stage" id="inkStage" hidden>
        <canvas id="inkCanvas"></canvas>
      </div>
      <!-- 网络错误 -->
      <div class="main-center" id="netErrorView" hidden>
        <p class="err-block">无法连接服务器</p>
        <button class="btn-primary" style="max-width:220px" id="retryBtn">重试</button>
      </div>
    </div>

    <aside class="user-panel" id="userPanel" hidden>
      <div class="panel-eyebrow">SESSION</div>
      <div class="panel-user" id="userNickname">—</div>
      <div class="panel-account" id="userAccount">—</div>
      <div class="panel-rows">
        <div class="panel-row">
          <span class="row-label">最后登录 IP</span>
          <span class="row-value" id="userIp">—</span>
        </div>
        <div class="panel-row">
          <span class="row-label">最后登录时间</span>
          <span class="row-value" id="userLoginTime">—</span>
        </div>
        <div class="panel-row">
          <span class="row-label">最后活动时间</span>
          <span class="row-value" id="userActiveTime">—</span>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn-primary" id="portalBtn">进入门户</button>
      </div>
    </aside>
  </main>

<script src="/js/auth.js"></script>
<script src="/js/ink.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
