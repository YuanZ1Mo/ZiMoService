<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · ZiMo Service</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/x-icon" href="/resource/favicon.ico">
<script src="/js/vue.global.prod.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="beacon beacon-idle" id="beacon"></span>
        <h1 class="auth-title">登录 ZiMo Service</h1>
      </div>

      <form id="loginForm" novalidate>
        <div class="field" id="accountField">
          <label for="account">账号</label>
          <input id="account" name="account" autocomplete="username" spellcheck="false"
                 placeholder="4-30 位字母、数字、下划线或短横线" maxlength="30">
          <div class="field-err" id="accountErr"></div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="8-64 位">
          <div class="field-err" id="passwordErr"></div>
        </div>

        <div class="form-err" id="formErr" hidden></div>

        <button class="btn-primary" id="submitBtn" type="submit">登录</button>
      </form>

      <div class="auth-links">
        <a href="/register">注册账号</a>
        <a href="/reset">找回密码</a>
      </div>
    </div>
  </div>

<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
